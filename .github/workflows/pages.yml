name: Validar e publicar Nimbo OS no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nimbo-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir e verificar SHA-256 do sistema
        run: npm run build
      - name: Consultar habilitação do GitHub Pages
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages habilitado: prosseguindo com publicação." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Compilação aprovada, mas GitHub Pages ainda não está habilitado (HTTP $code)." >> "$GITHUB_STEP_SUMMARY"
            echo "Para publicar: Settings > Pages > Build and deployment > GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preparar GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Enviar artefato do site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar no GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
